[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalint-portfolio"
version = "0.1.0"
description = "Know your data before you trust it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
datalint = "datalint.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
